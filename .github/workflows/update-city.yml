name: Rebuild contribution city

"on":
  schedule:
    - cron: "17 19 * * *"   # daily, ~00:17 in Pakistan (UTC+5)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-city.yml"

permissions:
  contents: write

jobs:
  city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py hasnain833
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # only used if the public page can't be read
      - name: Render city
        run: python scripts/render_city.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild contribution city [skip ci]"
          file_pattern: "data/contributions.json assets/city-dark.svg assets/city-light.svg"
